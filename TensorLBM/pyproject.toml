[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tensorlbm"
version = "0.1.0"
description = "PyTorch-based Lattice Boltzmann solver with mass-exchange selector"
requires-python = ">=3.9"
dependencies = ["torch>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
