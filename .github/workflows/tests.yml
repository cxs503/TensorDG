name: TensorDG tests

# Runner / queue contract (m4787, 2026-11-06)
# ------------------------------------------
# main@26a32789 went red with the job conclusion ``cancelled``, **zero steps
# executed** and ``runner_id = 0``: the job requested the custom label
# ``ci-loong64`` and no runner in this repository ever matched it.  The two
# repo-scoped listeners ``node099-ci-dg-1/2`` stayed in "Listening for Jobs"
# from 02:07 UTC onwards without a single job assignment, while every other
# repository sharing the same deployment batch picked its ``ci-loong64`` jobs
# up normally -> the label set of the DG runners, not the code, was the
# mismatch.  The pool is therefore addressed through the labels the runner
# registration always adds (``self-hosted`` + OS), which matches both a plain
# registration and one that *also* carries the custom pool label.
#
# ``concurrency`` follows the same lesson as the 2026-11-06 platform triage
# (docs/pr188-ci-repair): GitHub keeps only one running + one pending run per
# group, so a ref-wide group on ``main`` makes a newer merge silently cancel an
# older commit's *pending* run - which then reports red with no step executed.
# On ``main`` the group is therefore per commit; branches/PRs keep the ref-wide
# group (a new push still supersedes a stale one).

on:
  push:
  pull_request:

env:
  TORCH_DEVICE_BACKEND_AUTOLOAD: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: [self-hosted, linux]
    # A hung job must fail instead of holding one of the two pool runners for
    # hours (the hosted run of main@558f03f took 95 min end to end).
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m benchmarks.linear_advection_1d --degree 1 --cells 20 40 80
      - run: python -m benchmarks.linear_advection_1d --degree 2 --cells 10 20 40 80 --output-dir /tmp/advection1d --max-relative-error 0.03
      - run: python -m benchmarks.linear_advection_2d --cells 24 --degree 1 --output-dir /tmp/advection2d
      - run: python -m benchmarks.poisson_2d --cells 16 --degree 1 --output-dir /tmp/poisson2d
      - run: python -m benchmarks.euler_sod_1d --cells 120 --time 0.05 --output /tmp/sod.csv
      - run: python -m benchmarks.plot_euler_sod_1d --input /tmp/sod.csv --output /tmp/sod_profiles.png
      - run: python -m benchmarks.compare_euler_sod_1d --cells 3200 --time 0.2 --output-dir /tmp/sod-comparison
      - run: python -m benchmarks.burgers_1d --cells 16 32 64 --degree 2 --output-dir /tmp/burgers
      - run: python -m benchmarks.heat_1d --cells 16 --degree 2 --output-dir /tmp/heat
      - run: python -m benchmarks.lax_1d --cells 400 --degree 3 --cfl 0.35 --output-dir /tmp/lax
      - run: python -m benchmarks.isentropic_vortex_2d --cells 192 --output-dir /tmp/vortex
      # Unified advection-diffusion + dispersive surface (campaign P165W3-N05):
      # the same registry the report uses, in its CI configuration.
      - run: python -m benchmarks.dg --quick --outdir /tmp/dg-surface