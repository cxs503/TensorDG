name: TensorDG tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch numpy pytest matplotlib
      - run: pytest -q
      - run: python benchmarks/linear_advection_1d.py --degree 1 --cells 20 40 80
      - run: python benchmarks/linear_advection_1d.py --degree 2 --cells 10 20 40

      - run: python benchmarks/euler_sod_1d.py --cells 120 --time 0.05 --output /tmp/sod.csv
      - run: python benchmarks/plot_euler_sod_1d.py --input /tmp/sod.csv --output /tmp/sod_profiles.png
